# Forest Glass rice settings. Restore with:
#   dconf load / < rice-settings.ini

[org/gnome/desktop/interface]
gtk-theme='adw-gtk3-dark'
icon-theme='Papirus-Dark-Maia'
monospace-font-name='JetBrainsMono Nerd Font 11'
show-battery-percentage=true

[org/gnome/desktop/wm/keybindings]
close=['<Super>q', '<Alt>F4']

[org/gnome/settings-daemon/plugins/media-keys]
shutdown=@as []

[org/gnome/shell/extensions/arcmenu]
menu-border-radius=14
menu-button-active-bg-color=(true, 'rgba(183,243,74,0.14)')
menu-button-active-fg-color=(true, 'rgb(183,243,74)')
menu-button-bg-color=(true, 'rgba(16,21,16,0)')
menu-button-border-radius=(true, 8)
menu-button-border-width=(true, 0)
menu-button-fg-color=(true, 'rgb(32,201,107)')
menu-button-hover-bg-color=(true, 'rgba(32,201,107,0.14)')
menu-button-hover-fg-color=(true, 'rgb(32,201,107)')
runner-hotkey=['<Super>d']
runner-menu-width=460
runner-position='Centered'
runner-search-display-style='List'
runner-show-settings-button=false
search-entry-border-radius=(true, 10)

[org/gnome/shell/extensions/blur-my-shell/appfolder]
blur=false

[org/gnome/shell/extensions/blur-my-shell/applications]
blur=false

[org/gnome/shell/extensions/blur-my-shell/coverflow-alt-tab]
blur=false

[org/gnome/shell/extensions/blur-my-shell/dash-to-dock]
blur=true
static-blur=true

[org/gnome/shell/extensions/blur-my-shell/lockscreen]
blur=false

[org/gnome/shell/extensions/blur-my-shell/overview]
blur=true

[org/gnome/shell/extensions/blur-my-shell/panel]
blur=false

[org/gnome/shell/extensions/blur-my-shell/popup]
blur=false

[org/gnome/shell/extensions/blur-my-shell/screenshot]
blur=false

[org/gnome/shell/extensions/blur-my-shell/window-list]
blur=false

[org/gnome/shell/extensions/dash-to-dock]
hot-keys=false
hotkeys-show-dock=false

[org/gnome/shell/extensions/forge]
css-updated='1792520476227'

[org/gnome/shell/extensions/space-bar/appearance]
active-workspace-border-radius=0
active-workspace-border-width=0
active-workspace-padding-h=7
custom-styles='.space-bar-workspace-label {\n  font-family: "JetBrainsMono Nerd Font", monospace;\n  font-size: 11px;\n}'
custom-styles-enabled=true
inactive-workspace-background-color='rgba(0,0,0,0)'
inactive-workspace-border-radius=0
inactive-workspace-border-width=0
inactive-workspace-padding-h=7
workspace-margin=1

